<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrSys" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FF8160"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#0A0A0A"/>

  <!-- system boundary -->
  <rect x="30" y="60" width="900" height="360" rx="14" fill="none" stroke="#2A2A27" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="50" y="45" fill="#9C9B95" font-size="13" letter-spacing="1">AUTONOMOUS SCOOTER SYSTEM BOUNDARY</text>

  <!-- external actors -->
  <g>
    <rect x="10" y="185" width="150" height="60" rx="10" fill="none" stroke="#3F6B33" stroke-width="1.5"/>
    <text x="85" y="210" fill="#F5F4F0" font-size="13" font-weight="700" text-anchor="middle">GPS</text>
    <text x="85" y="228" fill="#9C9B95" font-size="11" text-anchor="middle">Satellites</text>
    <line x1="160" y1="215" x2="205" y2="215" stroke="#FF8160" stroke-width="2" marker-end="url(#arrSys)"/>
  </g>
  <g>
    <rect x="770" y="30" width="180" height="55" rx="10" fill="none" stroke="#3F6B33" stroke-width="1.5"/>
    <text x="860" y="53" fill="#F5F4F0" font-size="13" font-weight="700" text-anchor="middle">Rider / App</text>
    <text x="860" y="70" fill="#9C9B95" font-size="11" text-anchor="middle">Summon Request</text>
  </g>

  <!-- 4 main blocks -->
  <g>
    <rect x="205" y="160" width="170" height="110" rx="10" fill="#151513" stroke="#2A2A27" stroke-width="2"/>
    <text x="290" y="205" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Sensing &amp;</text>
    <text x="290" y="222" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Perception</text>
    <text x="290" y="245" fill="#9C9B95" font-size="11" text-anchor="middle">ZED · RealSense</text>
    <text x="290" y="259" fill="#9C9B95" font-size="11" text-anchor="middle">GPS · IMU</text>
  </g>

  <line x1="375" y1="215" x2="420" y2="215" stroke="#FF8160" stroke-width="2" marker-end="url(#arrSys)"/>

  <g>
    <rect x="420" y="160" width="170" height="110" rx="10" fill="#151513" stroke="#2A2A27" stroke-width="2"/>
    <text x="505" y="205" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">State</text>
    <text x="505" y="222" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Estimation</text>
    <text x="505" y="245" fill="#9C9B95" font-size="11" text-anchor="middle">Extended</text>
    <text x="505" y="259" fill="#9C9B95" font-size="11" text-anchor="middle">Kalman Filter</text>
  </g>

  <line x1="590" y1="215" x2="635" y2="215" stroke="#FF8160" stroke-width="2" marker-end="url(#arrSys)"/>

  <g>
    <rect x="635" y="160" width="170" height="110" rx="10" fill="#151513" stroke="#2A2A27" stroke-width="2"/>
    <text x="720" y="205" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Autonomy &amp;</text>
    <text x="720" y="222" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Planning</text>
    <text x="720" y="245" fill="#9C9B95" font-size="11" text-anchor="middle">Jetson Nano</text>
    <text x="720" y="259" fill="#9C9B95" font-size="11" text-anchor="middle">C++ / Python stack</text>
  </g>

  <path d="M805,240 L805,330 L505,330 L505,270" fill="none" stroke="#FF8160" stroke-width="2" marker-end="url(#arrSys)"/>
  <text x="655" y="322" fill="#9C9B95" font-size="10.5">velocity + steering command</text>

  <g>
    <rect x="420" y="330" width="170" height="80" rx="10" fill="#151513" stroke="#2A2A27" stroke-width="2"/>
    <text x="505" y="365" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Actuation</text>
    <text x="505" y="388" fill="#9C9B95" font-size="11" text-anchor="middle">ODrive BLDC + motor</text>
  </g>

  <!-- summon request into autonomy -->
  <path d="M860,85 L860,215 L805,215" fill="none" stroke="#FF8160" stroke-width="2" marker-end="url(#arrSys)"/>

  <!-- power subsystem feeding all -->
  <g>
    <rect x="60" y="330" width="170" height="80" rx="10" fill="none" stroke="#B8722A" stroke-width="1.5"/>
    <text x="145" y="365" fill="#F5F4F0" font-size="14" font-weight="700" text-anchor="middle">Power</text>
    <text x="145" y="388" fill="#9C9B95" font-size="11" text-anchor="middle">Scooter battery pack</text>
  </g>
  <line x1="145" y1="330" x2="145" y2="285" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="145" y1="285" x2="720" y2="285" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="290" y1="285" x2="290" y2="273" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrSys)"/>
  <line x1="505" y1="285" x2="505" y2="273" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrSys)"/>
  <line x1="720" y1="285" x2="720" y2="273" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrSys)"/>
  <line x1="505" y1="330" x2="505" y2="315" stroke="#B8722A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrSys)"/>
  <text x="640" y="277" fill="#B8722A" font-size="10.5">power to all subsystems</text>
</svg>
